<script>
var estado = 0;

function hide () {
	number = document.getElementById("gruposTotal").value;
	console.log("Função HIDE");
	elements = ["E1", "E2", "E3", "E4", "E5", "E6", "E7", "E8", "E9", "E10"]
  for (var index = 0; index < elements.length; index++) {
  	if(number <= index)
  		document.getElementById(elements[index]).style.display = 'none';
  	if(number > index)
  		document.getElementById(elements[index]).style.display = '';
  }
}

function parar(){
	if (confirm("Tem certeza que deseja parar?")) {
		window.location.href="/parar"
	} 
}

function preencher(){
	numero = document.getElementById("gruposTotal").value;
	console.log("Função Preencher");
	elements = ["espirasTotal0", "espirasTotal1", "espirasTotal2", "espirasTotal3", "espirasTotal4", "espirasTotal5", "espirasTotal6", "espirasTotal7", "espirasTotal8", "espirasTotal9"]
  for (var index = 1; index < elements.length; index++) {
  		document.getElementById(elements[index]).value = document.getElementById(elements[0]).value * (index + 1)
	}
}

function coletarInfos(){
    infosXHR = new XMLHttpRequest();
    infosXHR.open("GET", "/info");
    infosXHR.send();

    infosXHR.onload = function (){
        if(infosXHR.status==200){
            infos = infosXHR.responseText.split("\n");
            console.log(infos);
            document.getElementsByName("bobinasTotal")[0].value = infos[0];
            document.getElementsByName("gruposTotal")[0].value = infos[1];
            document.getElementsByName("velocidade")[0].value = infos[2];
            document.getElementsByName("espirasTotal0")[0].value = infos[3];
            document.getElementsByName("espirasTotal1")[0].value = infos[4];
            document.getElementsByName("espirasTotal2")[0].value = infos[5];
            document.getElementsByName("espirasTotal3")[0].value = infos[6];
            document.getElementsByName("espirasTotal4")[0].value = infos[7];
            document.getElementsByName("espirasTotal5")[0].value = infos[8];
            document.getElementsByName("espirasTotal6")[0].value = infos[9];
            document.getElementsByName("espirasTotal7")[0].value = infos[10];
            document.getElementsByName("espirasTotal8")[0].value = infos[11];
            document.getElementsByName("espirasTotal9")[0].value = infos[12];
            estado = infos[13];
            if(estado < 2)
            	document.getElementById("interferencia").value = "Movimento = " + infos[14];
            document.getElementsByName("potencia")[0].value = infos[15];
            hide();

        }
    }
} 


</script>
